name: Run Selenium Tests (CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest --disable-warnings -v

      - name: Convert Excel reports to HTML
        run: |
          pip install pandas openpyxl
          python - <<EOF
          import pandas as pd
          import glob, os

          # Đọc tất cả file Excel trong thư mục reports/screenshots
          files = glob.glob("reports/screenshots/*.xlsx")
          os.makedirs("reports/html_reports", exist_ok=True)

          for f in files:
              df = pd.read_excel(f)
              html_file = os.path.join("reports/html_reports", os.path.basename(f).replace(".xlsx", ".html"))
              df.to_html(html_file, index=False)
              print(f"✅ Converted {f} → {html_file}")
          EOF

      - name: Upload test results and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            reports/screenshots/*.xlsx
            reports/html_reports/*.html
            reports/screenshots/*.png
